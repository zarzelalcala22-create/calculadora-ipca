<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Índice de Continuidad Ósea (ICO)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 40px 20px; background-color: #f8f9fa; color: #212529; line-height: 1.5; }
        .container { max-width: 750px; background: #ffffff; padding: 40px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e9ecef; }
        h1 { color: #1a252f; font-size: 24px; font-weight: 700; margin-top: 0; margin-bottom: 8px; border-bottom: 2px solid #f1f3f5; padding-bottom: 15px; }
        .subtitle { color: #6c757d; font-size: 14px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .form-row { display: flex; gap: 20px; margin-bottom: 25px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #495057; }
        input[type="text"], input[type="number"], select { padding: 10px 14px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; background-color: #ffffff; transition: border-color 0.15s ease-in-out; }
        input:focus, select:focus { border-color: #2b6cb0; outline: 0; }
        .corte-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .corte-title { font-weight: 700; font-size: 15px; color: #2d3748; margin-bottom: 15px; }
        .corte-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; margin-bottom: 30px; }
        button { flex: 1; padding: 12px 20px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.15s ease-in-out; }
        .btn-primary { background-color: #2b6cb0; color: white; }
        .btn-primary:hover { background-color: #2c5282; }
        .btn-secondary { background-color: #2f855a; color: white; }
        .btn-secondary:hover { background-color: #22543d; }
        .result-box { padding: 20px; border-radius: 8px; font-size: 18px; font-weight: 700; margin-top: 25px; text-align: center; display: none; }
        .result-high { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .result-med { background-color: #feebc8; color: #744210; border: 1px solid #fbd38d; }
        .result-low { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

<div class="container">
    <h1>Índice de Continuidad Ósea (ICO)</h1>
    <div class="subtitle">Calculadora Automatizada e Instrumento de Campo Abierto</div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="casoId">No. de Caso / Expediente:</label>
            <input type="text" id="casoId" value="Caso-01">
        </div>
        <div class="form-group">
            <label for="numCortes">Confronta de cortes (c_i):</label>
            <input type="number" id="numCortes" value="2" min="1" max="50" oninput="generarFilas()" onchange="generarFilas()">
        </div>
    </div>

    <!-- CONTENEDOR SEGURO DONDE ENTRAN TUS MENÚS DESPLEGABLES -->
    <div id="contenedorCortes"></div>
    
    <div class="btn-group">
        <button class="btn-primary" onclick="calcularICO()">Calcular Probabilidad</button>
        <button class="btn-secondary" onclick="descargarCedula()">Descargar Cédula (.txt)</button>
    </div>

    <div class="result-box" id="resultadoBox"></div>
</div>

<script>
function generarFilas() {
    const num = parseInt(document.getElementById('numCortes').value) || 1;
    const contenedor = document.getElementById('contenedorCortes');
    contenedor.innerHTML = '<h3 style="font-size: 16px; margin-bottom: 15px; color: #4a5568;">Matriz de Criterios por Sección Ósea en Confronta:</h3>';
    
    for(let j=1; j<=num; j++) {
        contenedor.innerHTML += `
            <div class="corte-card">
                <div class="corte-title">Sección de Corte #${j}</div>
                <div class="corte-grid">
                    <div class="form-group">
                        <label style="font-size:12px; margin-bottom:4px;">V1: Bordes (0-3)</label>
                        <select class="v1_val">
                            <option value="3">Grado 3</option>
                            <option value="2">Grado 2</option>
                            <option value="1">Grado 1</option>
                            <option value="0">Grado 0</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px; margin-bottom:4px;">V2: Vernier (0-3)</label>
                        <select class="v2_val">
                            <option value="3">Grado 3</option>
                            <option value="2">Grado 2</option>
                            <option value="1">Grado 1</option>
                            <option value="0">Grado 0</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px; margin-bottom:4px;">V3: Anatomía (0-3)</label>
                        <select class="v3_val">
                            <option value="3">Grado 3</option>
                            <option value="2">Grado 2</option>
                            <option value="1">Grado 1</option>
                            <option value="0">Grado 0</option>
                        </select>
                    </div>
                </div>
            </div>
        `;
    }
}

function calcularICO() {
    const numCortes = parseInt(document.getElementById('numCortes').value) || 1;
    let sumaTotal = 0;
    
    const v1s = document.getElementsByClassName('v1_val');
    const v2s = document.getElementsByClassName('v2_val');
    const v3s = document.getElementsByClassName('v3_val');
    
    for(let i=0; i<numCortes; i++) {
        sumaTotal += parseInt(v1s[i].value) + parseInt(v2s[i].value) + parseInt(v3s[i].value);
    }
    
    const idealPossible = numCortes * 9;
    const ico = (sumaTotal / idealPossible) * 100;
    
    const resBox = document.getElementById('resultadoBox');
    resBox.style.display = 'block';
    resBox.className = 'result-box'; 
    
    let dictamen = "";
    if (ico >= 90) {
        resBox.classList.add('result-high');
        dictamen = "CORRESPONDENCIA ANATÓMICA ALTAMENTE PROBABLE (Reasociación Concluyente)";
    } else if (ico >= 70) {
        resBox.classList.add('result-med');
        dictamen = "CORRESPONDENCIA SUGESTIVA / COMPATIBILIDAD PARCIAL (Requiere pruebas complementarias)";
    } else {
        resBox.classList.add('result-low');
        dictamen = "EXCLUSIÓN DE CORRESPONDENCIA ANATÓMICA (Elementos Incompatibles)";
    }
    
    resBox.innerHTML = `ICO Resultante: ${ico.toFixed(2)}%<br><span style="font-size:13px; font-weight:600; text-transform:uppercase; margin-top:5px; display:block;">Dictamen: ${dictamen}</span>`;
    return ico.toFixed(2);
}

function descargarCedula() {
    const caso = document.getElementById('casoId').value;
    const num = document.getElementById('numCortes').value;
    const ico = calcularICO();
    
    let texto = `==================================================\n`;
    texto += ` CÉDULA FORENSE AUTOMÁTICA DE REGISTRO E INFORME (ICO)\n`;
    texto += `==================================================\n\n`;
    texto += `Identificador del Caso / Expediente: ${caso}\n`;
    texto += `Confronta de cortes (c_i): ${num}\n`;
    texto += `--------------------------------------------------\n`;
    texto += `ÍNDICE ICO FINAL OBTENIDO: ${ico}%\n`;
    
    let dictamen = ico >= 90 ? "CORRESPONDENCIA ANATÓMICA ALTAMENTE PROBABLE (Reasociación Concluyente)" : (ico >= 70 ? "CORRESPONDENCIA SUGESTIVA / COMPATIBILIDAD PARCIAL" : "EXCLUSIÓN DE CORRESPONDENCIA ANATÓMICA");
    texto += `DICTAMEN PRELIMINAR: ${dictamen}\n`;
    texto += `--------------------------------------------------\n\n`;
    texto += `Firma del Perito Antropólogo Físico Responsable: ____________________\n`;
    
    const blob = new Blob([texto], {type: "text/plain;charset=utf-8"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Cedula_ICO_${caso}.txt`;
    link.click();
}

// ARRANQUE AUTOMÁTICO SEGURO
generarFilas();
</script>

</body>
</html>
