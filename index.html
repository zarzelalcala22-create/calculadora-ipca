<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Índice de Continuidad Ósea (ICO)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 700px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 13px; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); box-sizing: border-box; }
        button { background-color: #34495e; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px; }
        button:hover { background-color: #2c3e50; }
        .result { margin-top: 20px; padding: 15px; background-color: #e8f4f8; border-left: 5px solid #2980b9; border-radius: 4px; font-size: 18px; font-weight: bold; }
        .corte-card { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 4px; background-color: #fafafa; }
        .corte-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Índice de Continuidad Ósea (ICO)</h2>
    <div class="subtitle">Calculadora Automatizada e Instrumento de Campo Abierto</div>
    
    <div class="form-group">
        <label>No. de Caso / Expediente:</label>
        <input type="text" id="casoId" value="Caso-01">
    </div>
    
    <div class="form-group">
        <label>Confronta de cortes (c_i):</label>
        <input type="number" id="numCortes" value="5" min="1" oninput="generarFilas()" onchange="generarFilas()">
    </div>

    <div id="contenedorCortes"></div>
    
    <button onclick="calcularIPCA()">Calcular Probabilidad</button>
    <button onclick="descargarCedula()" style="background-color: #27ae60;">Descargar Cédula (.txt)</button>

    <div class="result" id="resultadoTxt">ICO Final OBTENIDO: -- %</div>
</div>

<script>
function generarFilas() {
    const num = parseInt(document.getElementById('numCortes').value) || 1;
    const contenedor = document.getElementById('contenedorCortes');
    contenedor.innerHTML = '<h3 style="font-size: 15px; color: #7f8c8d; margin-bottom: 15px;">Matriz de Criterios por Sección Ósea en Confronta:</h3>';
    
    for(let j=1; j<=num; j++) {
        contenedor.innerHTML += `
            <div class="corte-card">
                <strong>Sección de Corte #${j}</strong>
                <div class="corte-grid">
                    <div>
                        <label style="font-size:11px; font-weight:normal;">V1: Bordes (0-3)</label>
                        <select class="v1_val"><option value="3">Grado 3</option><option value="2">Grado 2</option><option value="1">Grado 1</option><option value="0">Grado 0</option></select>
                    </div>
                    <div>
                        <label style="font-size:11px; font-weight:normal;">V2: Vernier (0-3)</label>
                        <select class="v2_val"><option value="3">Grado 3</option><option value="2">Grado 2</option><option value="1">Grado 1</option><option value="0">Grado 0</option></select>
                    </div>
                    <div>
                        <label style="font-size:11px; font-weight:normal;">V3: Anatomía (0-3)</label>
                        <select class="v3_val"><option value="3">Grado 3</option><option value="2">Grado 2</option><option value="1">Grado 1</option><option value="0">Grado 0</option></select>
                    </div>
                </div>
            </div>
        `;
    }
}

function calcularIPCA() {
    const numCortes = parseInt(document.getElementById('numCortes').value) || 1;
    let sumaTotal = 0;
    
    const v1s = document.getElementsByClassName('v1_val');
    const v2s = document.getElementsByClassName('v2_val');
    const v3s = document.getElementsByClassName('v3_val');
    
    for(let i=0; i<numCortes; i++) {
        sumaTotal += parseInt(v1s[i].value) + parseInt(v2s[i].value) + parseInt(v3s[i].value);
    }
    
    const idealPossible = numCortes * 9;
    const ipca = (sumaTotal / idealPossible) * 100;
    
    let dictamen = "";
    if (ipca >= 90) {
        dictamen = "CORRESPONDENCIA ANATÓMICA ALTAMENTE PROBABLE (Reasociación Concluyente)";
    } else if (ipca >= 70) {
        dictamen = "CORRESPONDENCIA SUGESTIVA / COMPATIBILIDAD PARCIAL (Requiere pruebas complementarias)";
    } else {
        dictamen = "EXCLUSIÓN DE CORRESPONDENCIA ANATÓMICA (Elementos Incompatibles)";
    }
    
    document.getElementById('resultadoTxt').innerHTML = "ICO Final OBTENIDO: " + ipca.toFixed(2) + "%<br><span style='font-size:12px; font-weight:normal; display:block; margin-top:5px;'>Dictamen: " + dictamen + "</span>";
    return ipca.toFixed(2);
}

function descargarCedula() {
    const caso = document.getElementById('casoId').value;
    const num = document.getElementById('numCortes').value;
    
    const numCortes = parseInt(num) || 1;
    let sumaTotal = 0;
    const v1s = document.getElementsByClassName('v1_val');
    const v2s = document.getElementsByClassName('v2_val');
    const v3s = document.getElementsByClassName('v3_val');
    for(let i=0; i<numCortes; i++) {
        sumaTotal += parseInt(v1s[i].value) + parseInt(v2s[i].value) + parseInt(v3s[i].value);
    }
    const idealPossible = numCortes * 9;
    const ipca = ((sumaTotal / idealPossible) * 100).toFixed(2);
    
    let dictamen = ipca >= 90 ? "CORRESPONDENCIA ANATÓMICA ALTAMENTE PROBABLE (Reasociación Concluyente)" : (ipca >= 70 ? "CORRESPONDENCIA SUGESTIVA / COMPATIBILIDAD PARCIAL" : "EXCLUSIÓN DE CORRESPONDENCIA ANATÓMICA");
    
    let texto = `==================================================\n`;
    texto += ` CÉDULA FORENSE AUTOMÁTICA DE REGISTRO E INFORME (ICO)\n`;
    texto += `==================================================\n\n`;
    texto += `Identificador del Caso / Expediente: ${caso}\n`;
    texto += `Confronta de cortes (c_i): ${num}\n`;
    texto += `--------------------------------------------------\n`;
    texto += `ÍNDICE ICO FINAL OBTENIDO: ${ipca}%\n`;
    texto += `DICTAMEN PRELIMINAR: ${dictamen}\n`;
    texto += `--------------------------------------------------\n\n`;
    texto += `Firma del Perito Antropólogo Físico Responsable: ____________________\n`;
    
    const blob = new Blob([texto], {type: "text/plain;charset=utf-8"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Cedula_ICO_${caso}.txt`;
    link.click();
}

generarFilas();
</script>

</body>
</html>
